name: Dependency Scan

# Trivy filesystem scan. Best-effort on PRs (continue-on-error), required on
# release branches (main / staging*).

on:
  pull_request:
    branches:
      - main
      - 'staging**'
      - 'dev**'
      - 'qa**'
  push:
    branches:
      - main
      - 'staging**'
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: ${{ github.event_name == 'pull_request' && !startsWith(github.base_ref, 'staging') && github.base_ref != 'main' }}
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
