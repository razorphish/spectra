name: Spectra - Cleanup Sub-environment

# Manually destroy a sandbox sub-environment (dev*/qa*/staging*/hotfix*).
# Refuses to run against prod. Requires typed confirmation that matches the
# environment name to prevent accidental destruction.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Sandbox environment to destroy (dev01, qa02, hotfix01, ...)'
        required: true
        type: string
      confirm:
        description: 'Type the environment name again to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      main_env: ${{ steps.parse.outputs.main_env }}
    steps:
      - name: Confirm input
        env:
          ENV: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$ENV" != "$CONFIRM" ]; then
            echo "::error::Confirmation mismatch ($CONFIRM != $ENV)"; exit 1
          fi
          if [[ ! "$ENV" =~ ^(dev[0-9]{2}|qa[0-9]{2}|staging[0-9]{2}|hotfix[0-9]{2})$ ]]; then
            echo "::error::Refusing to destroy unsupported environment: $ENV"; exit 1
          fi
      - name: Parse main env
        id: parse
        run: |
          ENV="${{ inputs.environment }}"
          MAIN_ENV="${ENV%%[0-9]*}"
          echo "main_env=$MAIN_ENV" >> "$GITHUB_OUTPUT"

  destroy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
      TF_VAR_neon_database_url: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Run cleanup
        run: ./scripts/ci/cleanup-subenv.sh "${{ needs.validate.outputs.main_env }}" "${{ inputs.environment }}"
