name: Spectra - CI

# Lint, test, and build on PRs and pushes. Acts as the required status check
# for branch protection on main / dev* / qa* / staging*.

on:
  pull_request:
    branches:
      - main
      - 'dev**'
      - 'qa**'
      - 'staging**'
      - 'hotfix**'
  push:
    branches:
      - main
      - 'dev**'
      - 'qa**'
      - 'staging**'
      - 'hotfix**'
  workflow_dispatch: {}

concurrency:
  group: spectra-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20.19.5' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.affected.outputs.base_sha }}
      head_sha: ${{ steps.affected.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute Nx base/head
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint-test-build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Nx affected (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx nx affected \
            --target=${{ matrix.target }} \
            --base=${{ needs.setup.outputs.base_sha }} \
            --head=${{ needs.setup.outputs.head_sha }} \
            --parallel=3

      - name: Nx run-many (push / dispatch)
        if: github.event_name != 'pull_request'
        run: npx nx run-many --target=${{ matrix.target }} --all --parallel=3
