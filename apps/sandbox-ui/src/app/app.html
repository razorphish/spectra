@if (auth0Configured) {
  @if (auth.isLoading$ | async) {
    <div class="auth-shell">Loading…</div>
  } @else {
    @if ((auth.isAuthenticated$ | async) && (auth.user$ | async); as user) {
      <div class="auth-shell">
        <p>Logged in as {{ user.email }}</p>
        <h2>User profile</h2>
        <pre>{{ user | json }}</pre>
        <button
          type="button"
          (click)="auth.logout({ logoutParams: { returnTo: window.location.origin } })"
        >
          Log out
        </button>
      </div>
    } @else {
      <div class="auth-shell">
        @if (auth.error$ | async; as error) {
          <p class="auth-error">Error: {{ error.message }}</p>
        }
        <button
          type="button"
          (click)="auth.loginWithRedirect({ authorizationParams: { screen_hint: 'signup' } })"
        >
          Sign up
        </button>
        <button type="button" (click)="auth.loginWithRedirect()">Log in</button>
      </div>
    }
  }
}

<router-outlet />
