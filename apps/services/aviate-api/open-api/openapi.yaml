openapi: 3.0.3
info:
  title: aviate-api
  version: 0.0.1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token (public/sandbox API audience)
  schemas:
    HelloResponse:
      type: object
      required: [message, segment, service, authenticated, principal]
      properties:
        message: { type: string, example: Hello from aviate-api }
        segment: { type: string, example: platform }
        service: { type: string, example: aviate-api }
        authenticated: { type: boolean, example: true }
        principal:
          type: object
          required: [sub]
          properties:
            sub: { type: string, example: auth0|abc123 }
    AuthErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    InitUploadRequest:
      type: object
      required: [orgId, bytesExpected]
      properties:
        orgId:
          type: string
          format: uuid
          description: Organization that owns the upload.
        applicationId:
          type: string
          format: uuid
          description: Optional developer application owning the upload.
        bytesExpected:
          type: integer
          minimum: 1
          maximum: 1073741824
          description: Expected byte size; capped at 1 GiB.
        contentType:
          type: string
          description: MIME type the client will PUT.
        filename:
          type: string
          description: Optional original filename (stored as metadata only).
    InitUploadResponse:
      type: object
      required: [uploadId, s3Bucket, s3Key, presignedPutUrl, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        s3Bucket:
          type: string
        s3Key:
          type: string
        presignedPutUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
    SandboxSessionResponse:
      type: object
      required: [userId, orgId, email]
      properties:
        userId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        email: { type: string, format: email }
    SandboxApplicationSummary:
      type: object
      required: [id, name, updatedAt, clientId, hasClientSecret, oauthClientType, oauthGrantType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        updatedAt: { type: string, format: date-time }
        clientId: { type: string }
        hasClientSecret: { type: boolean }
        oauthClientType: { type: string }
        oauthGrantType: { type: string }
    SandboxApplicationCreateRequest:
      type: object
      required: [name, redirectUris, acceptSpectraTos]
      properties:
        name: { type: string }
        redirectUris:
          type: array
          items: { type: string }
        acceptSpectraTos: { type: boolean }
        description: { type: string }
        companyWebsiteUrl: { type: string }
        privacyPolicyUrl: { type: string }
        applicationTosUrl: { type: string }
        supportEmail: { type: string }
        supportPhone: { type: string }
        developmentContacts: { type: string }
        logoUploadId: { type: string, format: uuid }
    SandboxApplicationCreateResponse:
      type: object
      required: [id, name, clientId, clientSecret, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string }
        clientSecret: { type: string }
        updatedAt: { type: string, format: date-time }
    SandboxApplicationDetail:
      type: object
      required:
        - id
        - name
        - updatedAt
        - clientId
        - hasClientSecret
        - oauthClientType
        - oauthGrantType
        - redirectUris
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        updatedAt: { type: string, format: date-time }
        clientId: { type: string }
        hasClientSecret: { type: boolean }
        oauthClientType: { type: string }
        oauthGrantType: { type: string }
        redirectUris:
          type: array
          items: { type: string }
        description: { type: string, nullable: true }
        companyWebsiteUrl: { type: string, nullable: true }
        privacyPolicyUrl: { type: string, nullable: true }
        applicationTosUrl: { type: string, nullable: true }
        supportEmail: { type: string, nullable: true }
        supportPhone: { type: string, nullable: true }
        developmentContacts: { type: string, nullable: true }
        logoUploadId: { type: string, format: uuid, nullable: true }
        spectraTosAcceptedAt: { type: string, format: date-time, nullable: true }
paths:
  /v1/platform/health:
    x-spectra-audience: internal
    get:
      tags: [System]
      summary: Liveness
      responses:
        '200':
          description: OK
  /v1/platform/ready:
    x-spectra-audience: public
    get:
      tags: [System]
      summary: Readiness
      responses:
        '200':
          description: OK
        '503':
          description: Dependency degraded
  /v1/platform/info:
    x-spectra-audience: public
    get:
      tags: [System]
      summary: Service metadata
      responses:
        '200':
          description: OK
  /v1/platform/stats:
    x-spectra-audience: internal
    get:
      tags: [System]
      summary: Control-plane table row counts (MVP; authenticate in production)
      responses:
        '200':
          description: OK
        '503':
          description: Database unavailable
  /v1/platform/hello:
    x-spectra-audience: public
    get:
      tags: [Sandbox]
      summary: Authenticated sandbox hello (platform segment)
      description: |
        Proves Auth0 bearer tokens reach aviate-api. Requires a sandbox-ui (or Swagger UI)
        access token with the **public** API audience. Use `/health` for unauthenticated probes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated greeting with principal `sub`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '503':
          description: Auth0 verifier not configured on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      x-spectra-testing: |
        curl -s -H "Authorization: Bearer $ACCESS_TOKEN" http://127.0.0.1:3000/v1/platform/hello

  /v1/platform/uploads/init:
    x-spectra-audience: internal
    post:
      tags: [Uploads]
      summary: Initialize an object upload (returns presigned PUT URL)
      description: |
        Creates an `uploads` row in Neon and returns a single-part PUT URL
        scoped to the env's uploads bucket. The client must `PUT` the
        payload using the same `Content-Type` (and `Content-Length` if
        provided) used in this request. Default cap: 1 GiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadRequest'
      responses:
        '201':
          description: Upload initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Uploads not configured (missing bucket env var).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/platform/sandbox/session:
    x-spectra-audience: integration
    get:
      tags: [Sandbox]
      summary: Bootstrap developer session (user + personal org)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session identifiers for sandbox portal APIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxSessionResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '503':
          description: Database or Auth0 not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/platform/sandbox/applications:
    x-spectra-audience: integration
    get:
      tags: [Sandbox]
      summary: List sandbox applications for the authenticated developer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/SandboxApplicationSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
    post:
      tags: [Sandbox]
      summary: Create sandbox application (returns client secret once)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxApplicationCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxApplicationCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: Application name not globally unique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/platform/sandbox/applications/{id}/rotate-client-secret:
    x-spectra-audience: integration
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Sandbox]
      summary: Rotate OAuth client secret (invalidates the previous secret)
      description: >-
        Returns the new client secret once. The previous secret stops working immediately.
        Use when the original secret was lost; secrets are stored hashed and cannot be read back.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret]
                properties:
                  clientSecret: { type: string }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/platform/sandbox/applications/{id}:
    x-spectra-audience: integration
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sandbox]
      summary: Get sandbox application
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxApplicationDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Sandbox]
      summary: Update sandbox application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxApplicationCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
                  updatedAt: { type: string, format: date-time }
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Sandbox]
      summary: Soft-delete sandbox application
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
