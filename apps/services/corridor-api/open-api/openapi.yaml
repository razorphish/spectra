openapi: 3.0.3
info:
  title: corridor-api
  version: 0.0.1
  description: Corridor API (Go). Paths are served under /v1/corridor on port 3005 locally.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token (public/sandbox API audience)
  schemas:
    HelloResponse:
      type: object
      required: [message, segment, service, authenticated, principal]
      properties:
        message: { type: string, example: Hello from corridor-api }
        segment: { type: string, example: corridor }
        service: { type: string, example: corridor-api }
        authenticated: { type: boolean, example: true }
        principal:
          type: object
          required: [sub]
          properties:
            sub: { type: string }
    AuthErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
paths:
  /v1/corridor/health:
    x-spectra-audience: internal
    get:
      tags: [System]
      summary: Liveness
      responses:
        '200':
          description: OK
  /v1/corridor/ready:
    x-spectra-audience: public
    get:
      tags: [System]
      summary: Readiness
      responses:
        '200':
          description: OK
  /v1/corridor/hello:
    x-spectra-audience: public
    get:
      tags: [Sandbox]
      summary: Authenticated sandbox hello (corridor segment)
      description: |
        Go implementation of the shared hello contract. Token must include the public API audience.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '503':
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      x-spectra-testing: |
        curl -s -H "Authorization: Bearer $ACCESS_TOKEN" http://127.0.0.1:3000/v1/corridor/hello
