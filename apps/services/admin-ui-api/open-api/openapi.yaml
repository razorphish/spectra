openapi: 3.0.3
info:
  title: admin-ui-api
  version: 0.0.1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token (audience = API identifier)
paths:
  /v1/admin/health:
    get:
      tags: [System]
      summary: Liveness
      responses:
        '200':
          description: OK
  /v1/admin/ready:
    get:
      tags: [System]
      summary: Readiness
      responses:
        '200':
          description: OK
        '503':
          description: Dependency degraded
  /v1/admin/info:
    get:
      tags: [System]
      summary: Service metadata
      responses:
        '200':
          description: OK
  /v1/admin/stats:
    get:
      tags: [System]
      summary: Control-plane row counts (staff API; requires Auth0 access token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Database unavailable or auth not configured
  /v1/admin/me/sync:
    post:
      tags: [Staff]
      summary: Upsert control-plane user from Auth0 access token
      description: |
        Requires Auth0 access token. Reads `sub` and email from token claims (standard `email` or
        namespaced `https://spectra.inc/admin/email` from an Auth0 Action). Creates or updates `spectra.users`.
        Does not create org memberships (v1).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User row created or updated
          content:
            application/json:
              schema:
                type: object
                required: [id, email, authSubject]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  authSubject: { type: string }
        '400':
          description: Missing email claim or invalid subject
        '401':
          description: Missing or invalid bearer token
        '409':
          description: Email or identity conflict
        '500':
          description: Database or sync error
        '503':
          description: Database URL not configured
  /v1/admin/logs:
    get:
      tags: [Logging]
      summary: Paginated audit log list (Vital Woman Reset adminList–style DTO; maps `spectra.audit_logs`)
      description: Requires Auth0 access token (same audience as /v1/admin/stats).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: module
          schema: { type: string }
        - in: query
          name: userId
          schema: { type: string, format: uuid }
        - in: query
          name: startDate
          schema: { type: string, format: date-time }
        - in: query
          name: endDate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
        '401':
          description: Missing or invalid bearer token
        '500':
          description: Query failed
        '503':
          description: Database not configured
  /v1/admin/logging/settings:
    get:
      tags: [Logging]
      summary: Logging-related platform settings (logging_level, log_to_console)
      description: Requires Auth0 access token (same audience as /v1/admin/stats).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Missing or invalid bearer token
        '500':
          description: Query failed
        '503':
          description: Database not configured
    put:
      tags: [Logging]
      summary: Upsert a single logging platform setting by key
      description: Requires Auth0 access token (same audience as /v1/admin/stats).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  enum: [logging_level, log_to_console]
                value: {}
      responses:
        '200':
          description: OK
        '400':
          description: Invalid key or value
        '401':
          description: Missing or invalid bearer token
        '500':
          description: Update failed
        '503':
          description: Database not configured
  /v1/admin/nav-sidebar-visibility:
    get:
      tags: [Admin UI]
      summary: Sidebar template nav visibility (hidden menu keys)
      description: |
        Reads `spectra.platform_settings` key `admin_ui.sidebar_nav_hidden_menu_keys` (JSON string array).
        If missing or invalid, returns default — all template sections hidden.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sidebarNavHiddenMenuKeys]
                properties:
                  sidebarNavHiddenMenuKeys:
                    type: array
                    items:
                      type: string
                      enum:
                        - authentication_pages
                        - error_pages
                        - user_profile
                        - landing
                        - iconography
                        - tables
                        - tanstack_table
                        - blank_page
        '401':
          description: Missing or invalid bearer token
        '500':
          description: Query failed
        '503':
          description: Database not configured
    put:
      tags: [Admin UI]
      summary: Replace sidebar template nav hidden keys
      description: |
        Upserts `admin_ui.sidebar_nav_hidden_menu_keys`. Empty array shows all template sections.
        Unknown keys are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sidebarNavHiddenMenuKeys]
              properties:
                sidebarNavHiddenMenuKeys:
                  type: array
                  items:
                    type: string
                    enum:
                      - authentication_pages
                      - error_pages
                      - user_profile
                      - landing
                      - iconography
                      - tables
                      - tanstack_table
                      - blank_page
      responses:
        '200':
          description: OK
        '400':
          description: Invalid body
        '401':
          description: Missing or invalid bearer token
        '500':
          description: Update failed
        '503':
          description: Database not configured
