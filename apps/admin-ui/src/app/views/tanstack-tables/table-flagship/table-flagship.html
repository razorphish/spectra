<app-page-breadcrumb
  title="Data table"
  subTitle1="TanStack Table"
  subTitle2="Default (full feature)"
  subText="Search, column filters, sorting, pagination, row selection, and row actions."
/>
<div class="main-content">
  <div class="row">
    <div class="col-lg-12">
      <div class="st-wrapper">
        <div class="st-toolbar row mb-4">
          <div class="col-12 col-sm-6 col-lg-6 col-xl-5 col-xxl-4 order-1 order-sm-0 mt-4 mt-sm-0">
            <div class="st-search-wrapper">
              <div class="input-group flex-nowrap" role="search">
                <span class="input-group-text px-2" id="search-icon-flagship">
                  <svg class="sa-icon sa-bold">
                    <use href="/assets/icons/sprite.svg#search"></use>
                  </svg>
                </span>
                <input
                  type="text"
                  (input)="table().setGlobalFilter($any($event.target).value)"
                  class="form-control"
                  id="flagship-search"
                  placeholder="Search..."
                  aria-label="Search input"
                  aria-describedby="search-icon-flagship"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>
          <div class="col d-flex justify-content-end align-items-center gap-2 flex-wrap">
            <span class="me-2 fw-semibold text-nowrap">Filter By:</span>
            <div class="app-search">
              <select
                [ngModel]="table.getColumn('status')?.getFilterValue() || 'All'"
                (ngModelChange)="table.setColumnFilters([{ id: 'status', value: $event }])"
                class="form-select form-control my-1 my-md-0"
              >
                <option value="All">Status</option>
                <option value="active">Active</option>
                <option value="pending">Pending</option>
                <option value="disable">Disable</option>
              </select>
            </div>
            <div class="app-search">
              <select
                [ngModel]="table.getColumn('amount')?.getFilterValue() || 'All'"
                (ngModelChange)="table.setColumnFilters([{ id: 'amount', value: $event }])"
                class="form-select form-control my-1 my-md-0"
              >
                <option value="All">Price Range</option>
                <option value="0-100">$0 - $100</option>
                <option value="100-200">$100 - $200</option>
                <option value="200-300">$200 - $300</option>
                <option value="300-400">$300 - $400</option>
                <option value="400+">$400+</option>
              </select>
            </div>
          </div>
        </div>
        <app-tanstack-table [table]="table" [deleteUser]="deleteUser" />
        <app-table-pagination
          [totalItems]="table.getFilteredRowModel().rows.length"
          [start]="table.getState().pagination.pageIndex * table.getState().pagination.pageSize + 1"
          [end]="
            Math.min(
              (table.getState().pagination.pageIndex + 1) * table.getState().pagination.pageSize >
                table.getFilteredRowModel().rows.length
                ? table.getFilteredRowModel().rows.length
                : (table.getState().pagination.pageIndex + 1) * table.getState().pagination.pageSize
            )
          "
          [itemsName]="'entries'"
          (previousPage)="this.table.previousPage()"
          [canPreviousPage]="table.getCanPreviousPage()"
          [pageCount]="table.getPageCount()"
          [pageIndex]="table.getState().pagination.pageIndex"
          (setPageIndex)="table.setPageIndex($event)"
          (nextPage)="this.table.nextPage()"
          [showInfo]="true"
          [pageSize]="table.getState().pagination.pageSize"
          (onPageSizeChange)="table.setPageSize($event)"
          [canNextPage]="table.getCanNextPage()"
        ></app-table-pagination>
      </div>
    </div>
  </div>
</div>
